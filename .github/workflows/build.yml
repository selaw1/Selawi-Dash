name: Build Selawi Dash

on:
  push:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      # Page-only changes go through site.yml, which does not rebuild the app.
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The private release key lives only in repository secrets. It is written to the runner's
      # temporary folder for this build and never committed.
      - name: Prepare the release key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::The SIGNING_KEYSTORE_BASE64 secret is not set, so the APK cannot be signed."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Selawi Dash (release)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk selawi-dash.apk
          # Stop if the APK is not signed with the release key, rather than publishing a bad file.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs selawi-dash.apk | grep -i "certificate DN"
          size=$(stat -c %s selawi-dash.apk)
          echo "APK size: $size bytes ($((size / 1048576)) MB)"
          # Cloudflare Pages serves files up to 25 MiB.
          if [ "$size" -gt 26214400 ]; then
            echo "::error::The APK is larger than 25 MB, too big for the download page."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: selawi-dash.apk

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      # Fixed download links for the car's browser:
      # .../releases/download/cockpit-latest/selawi-dash.apk
      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Replace the file inside the existing release rather than deleting and recreating the
          # release, so the download link never disappears while someone is downloading.
          publish() {
            if gh release view "$1" >/dev/null 2>&1; then
              gh release upload "$1" "$2" --clobber
              gh release edit "$1" --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Install on the head unit through Chrome."
            else
              gh release create "$1" "$2" --prerelease --target "$GITHUB_SHA" --title "$3" \
                --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Install on the head unit through Chrome."
            fi
          }
          publish cockpit-latest selawi-dash.apk "Selawi Dash (latest test build)"

      # The download page and the newest APK, uploaded to Cloudflare Pages. Skipped until the
      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are added to the repository.
      - name: Publish the download page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'selawi-dash' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not set yet; skipping the download page."
            exit 0
          fi
          rm -rf site-out && cp -r site site-out
          cp selawi-dash.apk site-out/
          size=$(awk "BEGIN { printf \"%.1f\", $(stat -c %s selawi-dash.apk) / 1048576 }")
          sed -i "s/__VERSION__/0.3.${GITHUB_RUN_NUMBER}/; s/__SIZE__/${size}/" site-out/index.html
          # Creates the Pages project the first time; after that this just reports it exists.
          npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main || true
          npx --yes wrangler@3 pages deploy site-out --project-name="$PROJECT" --branch=main --commit-dirty=true
