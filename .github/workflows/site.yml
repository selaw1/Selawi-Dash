name: Publish download page

# Website-only changes: reuse the APK already published by the full build instead of building the
# app again, so a page update takes about a minute of Actions time.
on:
  push:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download cockpit-latest --pattern selawi-dash.apk --dir .

      - name: Publish the download page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'selawi-dash' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not set; nothing to publish."
            exit 0
          fi
          # The version shown on the page, read from the APK itself.
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          version=$("$aapt2" dump badging selawi-dash.apk 2>/dev/null | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          size=$(awk "BEGIN { printf \"%.1f\", $(stat -c %s selawi-dash.apk) / 1048576 }")
          rm -rf site-out && cp -r site site-out
          cp selawi-dash.apk site-out/
          sed -i "s/__VERSION__/${version:-latest}/; s/__SIZE__/${size}/" site-out/index.html
          npx --yes wrangler@3 pages deploy site-out --project-name="$PROJECT" --branch=main --commit-dirty=true
