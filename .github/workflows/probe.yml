name: Build APKs

on:
  push:
    paths:
      - "app/**"
      - "probe/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build cockpit and probe
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :probe:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk selawi-dash.apk
          cp probe/build/outputs/apk/debug/probe-debug.apk cockpit-probe.apk

      - name: Render screenshots
        run: ./gradlew :app:recordPaparazziDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/src/test/snapshots/images/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            selawi-dash.apk
            cockpit-probe.apk

      # Fixed download links for the car's browser:
      # .../releases/download/cockpit-latest/selawi-dash.apk
      # .../releases/download/probe-latest/cockpit-probe.apk
      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish() {
            gh release delete "$1" --cleanup-tag --yes || true
            gh release create "$1" "$2" --prerelease --target "$GITHUB_SHA" --title "$3" \
              --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Install on the head unit through Chrome."
          }
          publish cockpit-latest selawi-dash.apk "Selawi Dash (latest test build)"
          publish probe-latest cockpit-probe.apk "Cockpit Probe (latest test build)"
          (cd app/src/test/snapshots/images && zip -q ../../../../../cockpit-screenshots.zip *.png)
          publish screenshots-latest cockpit-screenshots.zip "Cockpit screenshots (latest build)"
